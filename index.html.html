<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hạt Mầm</title>
    <!-- Thêm manifest để trở thành PWA -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
 <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>  
 <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f0a;
            color: #e0e0c0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            padding: 2rem;
            max-width: 400px;
        }
        .seed {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(1); }
        }
        h1 {
            font-size: 2rem;
            font-weight: normal;
            margin-bottom: 1.5rem;
            color: #b5a642;
        }
        p {
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .btn {
            background: #2d4a2d;
            color: #f0e6c0;
            border: 1px solid #6b8c42;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-family: inherit;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #3d623d;
            border-color: #a5b85a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="seed">🌱</div>
        <h1>Hạt Mầm</h1>
        <p>Mỗi ngày, gieo một hạt giống cho chính mình.</p>
        <button class="btn" onclick="startJourney()">Bắt đầu hành trình</button>
    </div>

    <script>
        function startJourney() {
            // Sau này sẽ điều hướng đến màn hình tiếp theo
            alert('Chào mừng đến với Hạt Mầm! Chúng ta sẽ cùng nhau lớn lên.');
        }
    </script>
</body>
</html>
